[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reklama"
version = "0.1.0"
description = "Generator pomysłów i promptów na dochodowe aplikacje + automatyczna publikacja do Google Play"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.92.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "rich>=13.7",
]

[project.scripts]
reklama = "reklama.cli:main"

[tool.setuptools.packages.find]
include = ["reklama*"]

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (engine pipeline)
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Build must not require secrets — engine falls back to rule-based AI.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
